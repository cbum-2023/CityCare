services:
  mongodb:
    image: mongo
    container_name: citycare-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: citycare-backend
    ports:
      - "5050:5000"
    depends_on:
      - mongodb
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/fixmytown
      - JWT_SECRET=yourVerySecretKey123

  frontend:
    build: ./frontend
    container_name: citycare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
